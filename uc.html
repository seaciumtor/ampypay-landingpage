<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmpyPay — Coming Soon</title>
<meta name="robots" content="noindex">
<meta name="description" content="AmpyPay is launching soon. AI-assisted enterprise payroll outsourcing.">
<style>
  :root{
    --navy:#0A1F44;
    --deep:#071737;
    --accent:#2563EA;
    --eyebrow:#6E96F5;
    --cream:#FBFBEE;
    --orange:#f97316;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    color:var(--cream);
    background:radial-gradient(120% 120% at 50% 0%,var(--navy) 0%,var(--deep) 70%);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  main{max-width:560px;text-align:center}
  .eyebrow{
    font-size:.8rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--eyebrow);
    margin-bottom:18px;
  }
  h1{
    font-size:clamp(2rem,7vw,3.25rem);
    line-height:1.08;
    font-weight:800;
    letter-spacing:-.02em;
    margin-bottom:18px;
  }
  h1 span{color:var(--accent)}
  p{
    font-size:clamp(1rem,2.5vw,1.125rem);
    line-height:1.6;
    color:rgba(251,251,238,.72);
    margin-bottom:32px;
  }
  footer{
    margin-top:44px;
    font-size:.8rem;
    color:rgba(251,251,238,.4);
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">AmpyPay</p>
    <h1>We're building something <span>better</span>.</h1>
    <p>Our site is under construction — check back soon.</p>
    <footer>&copy; 2026 AmpyPay, Powered by eUnite HCM</footer>
  </main>
</body>
</html>
